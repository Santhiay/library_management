{% extends "templates/web.html" %}

{% block page_content %}
<div class="py-3">
	<h1>{{ article_name }}</h1>
	{% if image %}<img src="{{ image }}" style="max-width: 300px;">{% endif %}
	<p><b>Author:</b> {{ author }}</p>
	<p><b>Publisher:</b> {{ publisher }}</p>
	<p><b>ISBN:</b> {{ isbn }}</p>
	<p><b>Status:</b> {{ status }}</p>
	<div>{{ description }}</div>
</div>
{% endblock %}
